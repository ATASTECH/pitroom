  <title id="t">How a Pitroom run flows</title>
  <desc id="d">The primary agent delegates to the Pitroom CLI. You pick a mode (read, isolate or write) and Pitroom starts a worker CLI (OpenCode, Codex or Claude Code). Worker events flow back to Pitroom, and answer, exact diff, receipt return to the agent.</desc>
